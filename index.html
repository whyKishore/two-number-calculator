<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Two-Number Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>Two-Number Calculator</h1>

        <form id="calculator-form">
            <div>
                <label for="number1">Number 1 :</label>
                <input type="number" id="number1" name="number1" step="any" required>
            </div>

            <div>
                <label for="number2">Number 2 :</label>
                <input type="number" id="number2" name="number2" step="any" required>
            </div>

            <div>
                <label for="operation">Operation :</label>
                <select id="operation" name="operation">
                    <option value="add">Add</option>
                    <option value="subtract">Subtract</option>
                    <option value="multiply">Multiply</option>
                    <option value="divide">Divide</option>
                </select>
            </div>

            <div>
                <button type="submit">Calculate</button>
            </div>
        </form>

        <div>
            <span>Result: </span>
            <b>
                <output id="result" for="number1 number2 operation" aria-live="polite"></output>
            </b>
        </div>

        <noscript>This calculator requires JavaScript to be enabled.</noscript>
    </main>
</body>

</html>
